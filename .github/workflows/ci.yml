name: Build and lint

on:
  push:
    branches: ["**"]
    paths-ignore: ["brand/**", "public/brand/**", "src/assets/brand/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
