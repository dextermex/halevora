name: Deploy to Cloudflare

# Builds the site and deploys the Worker (static assets + edge logic in
# worker.js) to Cloudflare. The custom domains are declared in wrangler.toml
# and bound on deploy, so halevora.com must be a zone on the same account.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" and
#                          "Workers Routes: Edit" (or the Workers template)
#   CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard
# Optional, forwarded to the Worker as secrets for the application form:
#   INTAKE_BOT_TOKEN, INTAKE_CHAT_ID, INTAKE_WEBHOOK_URL
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Intake secrets (only those that are set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTAKE_BOT_TOKEN: ${{ secrets.INTAKE_BOT_TOKEN }}
          INTAKE_CHAT_ID: ${{ secrets.INTAKE_CHAT_ID }}
          INTAKE_WEBHOOK_URL: ${{ secrets.INTAKE_WEBHOOK_URL }}
        run: |
          for k in INTAKE_BOT_TOKEN INTAKE_CHAT_ID INTAKE_WEBHOOK_URL; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$k"; else echo "skip $k"; fi
          done
